[tox]
envlist = py310, py311, py312, py313, py314
requires = tox>=4.22
           tox-uv>=1.17
skip_missing_interpreters = true

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
package = skip
setenv =
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
commands =
    pytest {posargs}
