[project]
name = "langgraph-cv-analyzer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "langchain-ollama>=0.3.0",
    "langgraph-cli[inmem]>=0.4.31",
    "langgraph-sdk>=0.2.9",
    "streamlit>=1.50",
    "pymupdf>=1.25",
    "colorama>=0.4 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "tox>=4.65.0",
    "tox-uv>=1.36.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", ".tox/*"]
